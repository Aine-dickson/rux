# Build the Zola site in `site/` and publish it to GitHub Pages.
#
# Fires on any push to `main` that touches the site (or this workflow), and can
# be run by hand from the Actions tab. One-time setup in the repo: Settings →
# Pages → Build and deployment → Source = "GitHub Actions".
#
# The Zola version is pinned; keep it in step with `site/config.toml`'s comment
# and with whatever you build locally.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # `docs/` is the source of truth for the reference, roadmap, and
      # contribute sections, so a docs-only edit has to redeploy too.
      - "docs/**"
      # The playground ships the runtime itself, compiled to wasm, so a change
      # to any crate changes the deployed site.
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Let the deploy push to Pages; read the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; don't cancel an in-flight one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: "0.22.1"
      # Must match the `wasm-bindgen` version cargo resolves, or the CLI refuses
      # to process the binary. If a dependency bump changes it, this fails loudly
      # with both versions printed. Bump it here to match.
      WASM_BINDGEN_VERSION: "0.2.126"
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are what the playground build is pinned to, and a
          # shallow clone has none.
          fetch-depth: 0

      # ── The playground bundle ──────────────────────────────────────────────
      # crates/rux-web compiled to wasm, emitted into site/static/wasm/ so Zola
      # copies it like any other static asset. It is built here rather than
      # committed: ~7 MB of binary does not belong in the history.
      #
      # Note this needs no node and no npm. wasm-bindgen is a Rust tool, which is
      # what keeps the "no JS toolchain" rule in site/config.toml intact.
      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          # The wasm build has its own profile and target dir; without this key
          # it would fight the native cache from the CI workflow.
          key: wasm-release

      - name: Install wasm-bindgen-cli
        run: |
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin \
              "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"
          wasm-bindgen --version

      # `site/build-playground.sh` is the one implementation, so what CI emits
      # and what a developer emits differ only by this flag.
      #
      # `--from-tag` is what makes the deployed playground run the latest
      # *released* runtime rather than the tip, so ruxlang.dev never
      # demonstrates behaviour nobody can install yet. The site itself is still
      # built from main, so the page can be fixed without waiting for a release.
      # That is also why the page imports the bundle as a namespace and
      # feature-detects: it may be newer than the runtime it is driving.
      #
      # A developer running the script with no flag gets the tip instead, which
      # is the half that was missing. During v0.7 a recipe copied from the page
      # documenting it failed in the playground beside it, because `/recipes/`
      # and `/reference/` track the tip and the bundle did not.
      - name: Build the playground from the latest release
        run: ./site/build-playground.sh --from-tag

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin

      # docs/ is canonical; site/content/{reference,roadmap,contribute} is
      # generated from it and committed. If someone edits docs/ without
      # re-running the sync, the committed copies go stale silently, so fail
      # here instead of publishing yesterday's text.
        # Invoked via `bash`, not `./`, on purpose: this repo is developed on
        # Windows, where the executable bit isn't preserved, so the script keeps
        # getting committed as 100644 and `./` fails with permission denied.
      - name: Check generated docs are in sync
        run: bash ./site/sync-docs.sh --check

      - name: Build
        working-directory: site
        # --drafts is off, so posts with `draft = true` stay unpublished.
        run: zola build

      # A literal newline inside a JS string once took the whole playground down
      # in production: an ES module that fails to parse runs nothing, so the page
      # looked alive while doing nothing. Zola has no opinion about JavaScript,
      # so nothing caught it. Node is used here purely as a syntax checker and is
      # not a build dependency; the site is still produced by Zola alone.
      - name: Syntax-check inline scripts
        working-directory: site
        run: python check-scripts.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
