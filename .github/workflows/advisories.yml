# Security advisories, for every dependency and for the rhai fork.
#
# Separate from ci.yml on purpose. An advisory arrives without anyone touching
# the code, so this has to run on a clock, and a new advisory against a crate
# should not fail every unrelated push until it is dealt with. It runs weekly,
# on any push that changes what is depended on, and by hand.
#
# Watchlist #31: nothing watched the dependency graph, and the vendored rhai
# fork receives no upstream fixes at all.
name: Advisories

on:
  schedule:
    # Mondays, 06:17 UTC: early in the week, and off the top of the hour when
    # every other scheduled job on GitHub starts.
    - cron: "17 6 * * 1"
  push:
    paths:
      - "Cargo.lock"
      - "deny.toml"
      - "crates/rux-rhai/DIVERGENCE.md"
      - "scripts/rhai-upstream.sh"
      - ".github/workflows/advisories.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories sources

  rhai-fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Has upstream rhai moved past what the fork reviewed?
        run: bash ./scripts/rhai-upstream.sh
