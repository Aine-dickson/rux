[workspace]
resolver = "2"
members = [
    "crates/rux-shell",
    "crates/rux-cli",
    "crates/rux-layout",
    "crates/rux-paint",
    "crates/rux-parser",
    "crates/rux-style",
    "crates/rux-runtime",
    "crates/rux-text",
    "crates/rux-reactive",
    "crates/rux-script",
]

[workspace.package]
edition = "2021"
# Tracks the release line, not the crate's own history: every crate in the
# workspace ships together under one version, so this is what the next tag will
# be. It sat at 0.1.0 through the v0.2 and v0.3 tags — reconciled here, because
# a wrong version is unfixable once it's on crates.io (yank ≠ unpublish).
version = "0.4.0"
license = "MIT"
repository = "https://github.com/Aine-dickson/rux"
homepage = "https://ruxlang.dev"
documentation = "https://ruxlang.dev"

# Shared dependency versions. `vello` re-exports the matching `wgpu`, `kurbo`,
# and `peniko`, so the shell uses `vello::wgpu` rather than pinning wgpu itself
# (avoids a version split between the renderer and the surface).
[workspace.dependencies]
winit = "0.30"
pollster = "0.4"
vello = "0.9"
taffy = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# System clipboard. `image-data` is off: we only ever move text, and it would
# pull a second copy of the `image` stack in.
arboard = { version = "3", default-features = false }
