[workspace]
resolver = "2"
members = [
    "crates/rux-shell",
    "crates/rux-cli",
    "crates/rux-layout",
    "crates/rux-paint",
    "crates/rux-parser",
    "crates/rux-style",
    "crates/rux-runtime",
    "crates/rux-text",
    "crates/rux-web",
    "crates/rux-highlight",
    "crates/rux-fmt",
    "crates/rux-reactive",
    "crates/rux-script",
]

[workspace.package]
edition = "2021"
# The `-dev` suffix is load-bearing: this is the line being *built*, not a
# release. v0.4.0 exists when it is tagged, and dropping the suffix is a step in
# the release commit (see RELEASING.md). Semver sorts 0.4.0-dev before 0.4.0, so
# a binary built from this tree can never be mistaken for the shipped one.
#
# Every crate in the workspace ships together under one version. It sat at 0.1.0
# through the v0.2 and v0.3 tags; reconciled onto the 0.4 line here, because a
# wrong version is unfixable once it is on crates.io (yank ≠ unpublish).
version = "0.7.0-dev"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aine-dickson/rux"
homepage = "https://ruxlang.dev"
documentation = "https://ruxlang.dev"

# The browser bundle is downloaded before anything renders, so it is tuned for
# size where the native build is tuned for speed. Kept as its own profile rather
# than folded into `release`: `opt-level = "z"` and a single codegen unit would
# make the desktop app slower to build and slower to run, for a size nobody
# downloads. Build with `--profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
# There is no unwinding on wasm anyway, and the panic hook still reports to the
# console before aborting.
panic = "abort"
strip = true

# Shared dependency versions. `vello` re-exports the matching `wgpu`, `kurbo`,
# and `peniko`, so the shell uses `vello::wgpu` rather than pinning wgpu itself
# (avoids a version split between the renderer and the surface).
[workspace.dependencies]
# The Rux crates themselves, declared here rather than as paths in each member.
#
# `cargo publish` rejects a path dependency with no version, so publishing means
# every intra-workspace dep carries one, and every one of them has to be bumped
# at every release. Declaring them once makes that a single block to edit rather
# than nineteen lines spread across six files, which is the shape of mistake
# that only shows up as a broken crate nobody can install.
#
# The version must match `[workspace.package] version` exactly. `RELEASING.md`
# step 4 covers both.
rux-parser = { version = "0.7.0-dev", path = "crates/rux-parser" }
rux-reactive = { version = "0.7.0-dev", path = "crates/rux-reactive" }
rux-text = { version = "0.7.0-dev", path = "crates/rux-text" }
rux-layout = { version = "0.7.0-dev", path = "crates/rux-layout" }
rux-fmt = { version = "0.7.0-dev", path = "crates/rux-fmt" }
rux-script = { version = "0.7.0-dev", path = "crates/rux-script" }
rux-paint = { version = "0.7.0-dev", path = "crates/rux-paint" }
rux-style = { version = "0.7.0-dev", path = "crates/rux-style" }
rux-runtime = { version = "0.7.0-dev", path = "crates/rux-runtime" }
rux-shell = { version = "0.7.0-dev", path = "crates/rux-shell" }
# Not published (see its own `publish = false`), so it needs no version: nothing
# on crates.io will ever have to resolve it.
rux-highlight = { path = "crates/rux-highlight" }

winit = "0.30"
pollster = "0.4"
vello = "0.9"
taffy = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# System clipboard. `image-data` is off: we only ever move text, and it would
# pull a second copy of the `image` stack in.
arboard = { version = "3", default-features = false }
