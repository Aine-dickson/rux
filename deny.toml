# cargo-deny: what `.github/workflows/advisories.yml` checks in every
# dependency, weekly and whenever Cargo.lock changes.
#
# Two checks, deliberately not all four. Advisories are the point (watchlist
# #31: nothing watched the dependency graph for security fixes), and sources
# are cheap: everything comes from crates.io or this repository. Licenses and
# bans are real questions with real answers to write down first, so they wait
# rather than land as a wall of noise nobody reads.
#
# The vendored rhai fork is invisible to this, since RustSec files advisories
# under `rhai` and the package is `rux-rhai`. `scripts/rhai-upstream.sh`
# covers it.

[graph]
# Every platform Rux ships to, so an advisory in a dependency only one of them
# pulls in (Android's JNI, the web's wasm-bindgen) is not missed.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "aarch64-linux-android",
  "x86_64-linux-android",
  "wasm32-unknown-unknown",
]
all-features = false

[advisories]
# An unmaintained crate a Rux crate depends on directly fails the check, since
# that is a dependency Rux chose and can replace; one deeper in the graph is
# its parent's to replace, and is not reported.
unmaintained = "workspace"
yanked = "warn"
ignore = [
  # Unmaintained, not vulnerable. It is rhai's dependency and comes with the
  # fork; replacing it would be a divergence across 20 of the fork's files, to
  # carry through every upstream release.
  # Reviewed 2026-09-24. Revisit when upstream rhai drops or replaces it.
  { id = "RUSTSEC-2026-0249", reason = "rhai's own dependency; unmaintained, no known vulnerability" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
