[package]
name = "rux-text"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rux text engine: parley shaping/layout + vello glyph drawing. Internal to Rux; the supported entry point is the ruxlang crate."
readme = "README.md"
keywords = ["ui", "text", "font", "shaping"]
categories = ["gui", "text-processing"]

[dependencies]
parley = "0.11"
vello.workspace = true
# The run and inline-box types of a `<text>` live beside `TextContent`, so a
# paragraph reaches the engine as layout built it, with nothing converted.
rux-layout.workspace = true
# parley added via `cargo add` so the version compatible with vello is pinned.
