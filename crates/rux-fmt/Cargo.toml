[package]
name = "rux-fmt"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tag- and bracket-aware re-indentation for .rux files. Internal to Rux; the supported entry point is the ruxlang crate."
readme = "README.md"
keywords = ["ui", "formatter", "rux"]
categories = ["gui", "development-tools"]

[dependencies]
# Only for the void-tag list. The formatter indents by what never nests and the
# parser decides what never nests; two answers to that question is how `<image>`
# came to be missing from one of them.
rux-parser.workspace = true
# To find where a retired type name stands in a type and not in a value.
rux-syntax.workspace = true
