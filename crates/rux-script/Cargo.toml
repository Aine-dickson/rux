[package]
name = "rux-script"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rux script tier: Rux's type checker and interpreter, holding a document's state, plus the host registry. Internal to Rux; the supported entry point is the ruxlang crate."
readme = "README.md"
keywords = ["ui", "scripting", "interpreter"]
categories = ["gui"]

[dependencies]
rux-reactive.workspace = true
# Rux's own parser: every script is read by it. See docs/archive/language-build-log.md, step 2.
rux-syntax.workspace = true
# The typed IR and the type language the checker shares with it: step 4 of
# docs/archive/language-build-log.md. `types` is re-exported from here as it always was.
rux-ir.workspace = true
# Native modules: the boundary value and the registry. docs/archive/language-build-log.md, step 8.
rux-native.workspace = true
# `now()`'s clock: `std::time::Instant` on native, the browser's on the web,
# where `Instant` panics. The shell already depends on it. Also `Date.now()`'s
# wall clock, for the same reason.
web-time = "1.1"

# `Date.time(ms)` and the rest: a time's parts in the local time zone, which
# std cannot find. jiff reads the system's zone on Windows, macOS, Linux and
# Android (`tzdb-bundle-platform` carries the zone database on Windows only,
# which has none of its own in that form).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jiff = { version = "1", default-features = false, features = ["std", "tz-system", "tz-fat", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated"] }

# On the web the browser's `Date` gives the offset at an instant, and jiff
# does the calendar with no zone database in the bundle.
[target.'cfg(target_arch = "wasm32")'.dependencies]
jiff = { version = "1", default-features = false, features = ["std"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
# The attributes, for tests written as an app writes its native/ crate.
rux-native = { workspace = true, features = ["macros"] }
