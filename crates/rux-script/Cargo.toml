[package]
name = "rux-script"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rux script tier: a rhai engine holding state, plus the host registry. Internal to Rux; the supported entry point is the ruxlang crate."
readme = "README.md"
keywords = ["ui", "scripting", "rhai"]
categories = ["gui"]

[dependencies]
# `rux-rhai`, Rux's fork of rhai, aliased to `rhai` by the workspace so the code
# in here reads the same either way. See crates/rux-rhai/DIVERGENCE.md.
rhai.workspace = true
rux-reactive.workspace = true
# Rux's own parser: the front door every script passes before the fork
# compiles it. See src/front.rs and docs/11-next.md, step 2.
rux-syntax.workspace = true
