[package]
name = "rux-script"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rux script tier: Rux's type checker and interpreter, holding a document's state, plus the host registry. Internal to Rux; the supported entry point is the ruxlang crate."
readme = "README.md"
keywords = ["ui", "scripting", "interpreter"]
categories = ["gui"]

[dependencies]
rux-reactive.workspace = true
# Rux's own parser: every script is read by it. See docs/11-next.md, step 2.
rux-syntax.workspace = true
# The typed IR and the type language the checker shares with it: step 4 of
# docs/11-next.md. `types` is re-exported from here as it always was.
rux-ir.workspace = true
