[package]
name = "rux-paint"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rux painter: turns resolved paint items into a vello Scene. Internal to Rux; the supported entry point is the ruxlang crate."
readme = "README.md"
keywords = ["ui", "graphics", "gpu", "vello"]
categories = ["gui", "graphics"]

[dependencies]
vello.workspace = true
image.workspace = true
rux-layout.workspace = true
rux-text.workspace = true
# SVG pictures, drawn as vectors so they stay sharp at any size. 0.10 is the
# one built on vello 0.9. Its raster formats are off: a bitmap inside an SVG
# is not drawn.
vello_svg = { version = "0.10", default-features = false }
