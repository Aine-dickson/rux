[package]
name = "rux-style"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rux styling: literal CSS (lightningcss) cascaded onto the template tree. Internal to Rux; the supported entry point is the ruxlang crate."
readme = "README.md"
keywords = ["ui", "css", "styling", "cascade"]
categories = ["gui"]

[dependencies]
rux-parser.workspace = true
rux-layout.workspace = true
rux-reactive.workspace = true
rux-script.workspace = true
# Parsing and printing only. The default features are a bundler's (rayon,
# dashmap, source maps, node.js serde), none of which Rux uses, and the source
# map support brought in `rkyv` 0.7, which carries RUSTSEC-2026-0235.
lightningcss = { version = "1.0.0-alpha.71", default-features = false }
regex-lite = "0.1.9"
# lightningcss added via `cargo add` so the exact published version is pinned.
