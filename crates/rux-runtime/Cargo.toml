[package]
name = "rux-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rux runtime document model: loads a .rux file into a renderable tree."

[dependencies]
image.workspace = true
rux-parser = { path = "../rux-parser" }
rux-style = { path = "../rux-style" }
rux-layout = { path = "../rux-layout" }
rux-script = { path = "../rux-script" }

# Not used directly. `ahash` (via lightningcss and rhai) needs `getrandom`, and
# on wasm32 getrandom builds only when its `wasm_js` feature is on — feature
# unification means someone in the graph has to ask for it, so the runtime does,
# on behalf of any wasm consumer. Paired with the rustflag in `.cargo/config.toml`;
# both are required. No effect on native builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
