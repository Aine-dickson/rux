[package]
name = "rux-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rux runtime document model: loads a .rux file into a renderable tree. Internal to Rux; the supported entry point is the ruxlang crate."
readme = "README.md"
keywords = ["ui", "runtime", "rux"]
categories = ["gui"]

[dependencies]
image.workspace = true
rux-parser.workspace = true
rux-style.workspace = true
# For `Warning` and the JSON escaper the checker and the playground share.
rux-reactive.workspace = true
rux-layout.workspace = true
rux-script.workspace = true
# Native modules, re-exported as `rux_runtime::native`: docs/11-next.md, step 8.
rux-native.workspace = true
# The declarations in a script (`use`, `prop`, `computed`, lifecycle blocks)
# are found by Rux's own parser. See docs/11-next.md, step 2.
rux-syntax.workspace = true
# The typed IR, lowered and verified on load: docs/11-next.md, step 4.
rux-ir.workspace = true

# Not used directly. `ahash` (via lightningcss) needs `getrandom`, and
# on wasm32 getrandom builds only when its `wasm_js` feature is on, and feature
# unification means someone in the graph has to ask for it, so the runtime does,
# on behalf of any wasm consumer. Paired with the rustflag in `.cargo/config.toml`;
# both are required. No effect on native builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

# Network images (`src="https://…"`), fetched on a thread. Not on the web,
# where the shell hands the fetch to the browser. rustls with its webpki
# roots, so nothing is asked of the system's certificate store. See
# src/remote.rs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
