[package]
name = "rux-shell"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rux runtime shell: window, GPU surface, input, and frame loop. Internal to Rux; the supported entry point is the ruxlang crate."
readme = "README.md"
keywords = ["ui", "window", "gpu", "winit"]
categories = ["gui"]

# docs.rs documents the host target only. Half of this crate is behind
# `cfg(target_arch = "wasm32")` (the IME, the hidden input that raises a phone's
# keyboard, the clipboard), including `start_web`, `resize_web`,
# `set_web_source` and `diagnose_web_source`, so without the wasm target in this
# list the published docs would simply not mention the web shell exists.
#
# This is the only crate that needs it: every other published crate has no
# target-gated code at all.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
winit.workspace = true
vello.workspace = true
rux-layout.workspace = true
rux-paint.workspace = true
rux-runtime.workspace = true
rux-text.workspace = true
rux-reactive.workspace = true
# `std::time::Instant` panics on wasm; web-time swaps in the browser clock there
# and re-exports std everywhere else. winit already depends on it, so this adds
# no weight; it just lets our code name the same type winit's API expects.
web-time = "1.1"

# Blocking on a future is native, and a wasm main thread must not block, so the
# web build awaits the same futures instead. Android blocks exactly as a desktop
# does, which is why this one is not in the desktop-only list below.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

# Desktop-only platform services, and "desktop" here means neither a browser nor
# a phone. Each of these wraps something both of those either lack or spell
# differently, and the split is three-way rather than native/web because Android
# is native and still has none of them:
#   notify     watches the filesystem for hot reload. A browser has no
#              filesystem, and an APK's documents are assets behind an
#              AssetManager rather than files anything can watch. Android
#              reloads over `adb` instead.
#   arboard    talks to the OS clipboard. The browser's is async and
#              permissioned; Android's is a Java API reached through JNI.
#   accesskit  wraps the per-platform accessibility APIs (UI Automation, AT-SPI,
#              NSAccessibility). The web already has an accessibility tree of
#              its own, Android has one behind the same JNI, and accesskit_winit
#              has an adapter for neither.
# Everything above this line (window, input, focus, layout, paint) is shared.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
notify = "8.2.0"
arboard.workspace = true
accesskit = "0.24.1"
accesskit_winit = "0.33.2"

# The browser's stand-ins: a task spawner instead of blocking, and the
# canvas/console bindings winit and the loader need.
# Asking Windows whether the person has turned animations off. winit 0.30
# exposes nothing for it, and this is already in the lockfile several times over
# by way of winit and arboard, so it costs a feature flag and no build time.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

# Android reaches winit through `android-activity`, which is why an Android app
# is a cdylib exporting `android_main` rather than a binary with a `fn main`.
#
# **`native-activity`, not `game-activity`**, and the reason is the milestone's
# whole promise. GameActivity is the better-supported half of android-activity,
# but it is delivered as an androidx AAR, and consuming an AAR means Gradle.
# NativeActivity is part of the platform itself: the manifest names
# `android.app.NativeActivity`, the system loads the `.so`, and nothing Java is
# built at any point. Choosing the better-supported backend here would cost
# exactly the thing v0.8 exists to avoid.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
# Reading the `String` an input method hands back, which is the one piece of JNI
# that cannot be done with primitives alone. Already in the lockfile by way of
# `android-activity`, so it costs a line here and nothing at build time.
jni = "0.22"
# The JavaVM and the activity object, for the one call that has to go from Rust
# into Java. Also already in the lockfile by way of `android-activity`.
ndk-context = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
# The extra features past the canvas are the soft-keyboard sink: a browser only
# raises a phone's keyboard for a focused DOM element, and a `<canvas>` is not
# one, so the shell keeps a real `<input>` over the field it is editing.
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "console",
    "Clipboard",
    "Navigator",
    "CompositionEvent",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "MediaQueryList",
    "Node",
    "Window",
    # The router's web half: read the path the page was opened at, push an entry
    # per navigation, and hear the browser's own Back and Forward.
    "History",
    "Location",
    "PopStateEvent",
] }
