[package]
name = "rux-shell"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rux runtime shell: window, GPU surface, input, and frame loop."

[dependencies]
winit.workspace = true
vello.workspace = true
pollster.workspace = true
rux-layout = { path = "../rux-layout" }
rux-paint = { path = "../rux-paint" }
rux-runtime = { path = "../rux-runtime" }
rux-text = { path = "../rux-text" }
notify = "8.2.0"
arboard.workspace = true
# The explicit version is what `cargo publish` requires of a path dependency —
# a bare `path` won't publish. It must track `workspace.package.version` exactly,
# including the `-dev` suffix: a plain `0.4.0` requirement does NOT match the
# prerelease `0.4.0-dev`, so dropping the suffix here alone breaks the build.
rux-reactive = { version = "0.4.0-dev", path = "../rux-reactive" }
accesskit = "0.24.1"
accesskit_winit = "0.33.2"
