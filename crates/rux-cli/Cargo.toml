[package]
# Published as `ruxlang`, not `rux`: the bare `rux` name on crates.io is held by
# an unrelated, long-abandoned Linux I/O library. crates.io namespaces *package*
# names, not binary names, so `[[bin]] name = "rux"` below is unaffected —
# `cargo install ruxlang` still puts a `rux` command on your PATH. Same pattern
# as ripgrep (package `ripgrep`, binary `rg`), and it matches the domain.
name = "ruxlang"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rux command-line entry point (`rux run app.rux`)."

[[bin]]
name = "rux"
path = "src/main.rs"

[dependencies]
rux-shell = { path = "../rux-shell" }
