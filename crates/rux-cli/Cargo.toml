[package]
# Published as `ruxlang`, not `rux`: the bare `rux` name on crates.io is held by
# an unrelated, long-abandoned Linux I/O library. crates.io namespaces *package*
# names, not binary names, so `[[bin]] name = "rux"` below is unaffected;
# `cargo install ruxlang` still puts a `rux` command on your PATH. Same pattern
# as ripgrep (package `ripgrep`, binary `rg`), and it matches the domain.
name = "ruxlang"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rux: a pure-Rust, web-flavored UI language that renders natively on the GPU. Run, check and format .rux files."
# crates.io renders this as the crate's page, and a package with none is a bare
# title and a version. It is the first thing anyone finding Rux by search reads,
# so it is its own file rather than the repository README, which opens with
# things (screenshots, a docs tree) that do not belong on a crate page.
readme = "README.md"
homepage = "https://ruxlang.dev"
documentation = "https://ruxlang.dev/reference/"
keywords = ["ui", "gui", "gpu", "css", "declarative"]
categories = ["gui", "command-line-utilities"]

[[bin]]
name = "rux"
path = "src/main.rs"

[dependencies]
rux-shell.workspace = true
# `rux check` loads documents through the same path the window does, so the
# checker cannot disagree with the runtime about what a valid file is.
rux-runtime.workspace = true
# `rux fmt` is the one implementation of the re-indenter, replacing the copy the
# VS Code extension used to carry in JavaScript.
rux-fmt.workspace = true
# `rux vocab` prints the honored-CSS list for the editor's completions, and it
# has to be *the* list the unhonored-property warning consults, not a copy.
rux-style.workspace = true
# The bundled icon set. It lives on this side of the tree deliberately: an
# app's generated crate depends on `rux-runtime`, so icon data behind that
# edge would be compiled by every app with nothing able to shake it out.
rux-icons.workspace = true
# For the element list only, and only in a test: `rux vocab` offers the elements
# and the parser decides what a tag may be, so the two have to be one list. The
# void-tag list drifted exactly this way once already.
rux-parser.workspace = true
# Rescaling one icon into the five densities Android wants. Free in compile
# time: `rux-runtime` already depends on it to decode what `<img>` draws, so it
# is in the graph either way and this is a second user of a built crate.
image.workspace = true
# `rux build` reads `rux.toml`. Parsed as a `Value` rather than derived, so
# this pulls the parser and not a proc-macro build: the manifest is one
# four-key table, and compile time is something this milestone is judged on.
toml = "0.9"
