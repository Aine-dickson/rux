[package]
name = "rux-web"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rux in the browser: the runtime and shell compiled to WebAssembly, rendering to a canvas."
# Not published. This is a `cdylib` for `wasm32` that only the playground links,
# not a library anyone would depend on, and a crates.io name is held forever
# whether or not it turns out to be useful. It is built from a git tag by
# `site.yml`, which needs no registry.
publish = false

[lib]
# `cdylib` is what wasm-bindgen links; `rlib` keeps the crate testable natively,
# which is how the embedded font is checked without a browser.
crate-type = ["cdylib", "rlib"]

[dependencies]
rux-shell.workspace = true
rux-highlight.workspace = true
rux-fmt.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }

# Native-only, and only for tests: proves the vendored font actually parses and
# shapes before it is baked into a wasm bundle nobody can debug.
[dev-dependencies]
rux-text.workspace = true
rux-runtime.workspace = true
